[versions]
agp              = "8.6.1"
kotlin           = "2.0.20"
ksp              = "2.0.20-1.0.25"
composeBom       = "2024.10.00"
coreKtx          = "1.13.1"
lifecycleRuntime = "2.8.6"
activityCompose  = "1.9.2"
navigation       = "2.8.2"
room             = "2.6.1"
coroutines       = "1.8.1"
workManager      = "2.9.1"
okhttp           = "4.12.0"
kotlinxSer       = "1.7.3"
jsoup            = "1.18.1"
datastore        = "1.1.1"
documentfile     = "1.0.1"
coil             = "2.7.0"
splashscreen     = "1.0.1"
material         = "1.12.0"
sqlcipher        = "4.5.4"
junit            = "4.13.2"
mockk            = "1.13.13"

[libraries]
compose-bom                    = { group = "androidx.compose",       name = "compose-bom",                version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",    name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",    name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",    name = "ui-tooling" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons         = { group = "androidx.compose.material", name = "material-icons-extended" }
core-ktx                       = { group = "androidx.core",          name = "core-ktx",               version.ref = "coreKtx" }
lifecycle-runtime              = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",  version.ref = "lifecycleRuntime" }
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
activity-compose               = { group = "androidx.activity",       name = "activity-compose",       version.ref = "activityCompose" }
navigation-compose             = { group = "androidx.navigation",     name = "navigation-compose",     version.ref = "navigation" }
room-runtime                   = { group = "androidx.room",           name = "room-runtime",           version.ref = "room" }
room-ktx                       = { group = "androidx.room",           name = "room-ktx",               version.ref = "room" }
room-compiler                  = { group = "androidx.room",           name = "room-compiler",          version.ref = "room" }
coroutines-android             = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
work-runtime                   = { group = "androidx.work",           name = "work-runtime-ktx",       version.ref = "workManager" }
okhttp                         = { group = "com.squareup.okhttp3",    name = "okhttp",                 version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",    name = "logging-interceptor",    version.ref = "okhttp" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json", version.ref = "kotlinxSer" }
jsoup                          = { group = "org.jsoup",               name = "jsoup",                  version.ref = "jsoup" }
datastore-preferences          = { group = "androidx.datastore",      name = "datastore-preferences",  version.ref = "datastore" }
documentfile                   = { group = "androidx.documentfile",   name = "documentfile",           version.ref = "documentfile" }
coil-compose                   = { group = "io.coil-kt",              name = "coil-compose",           version.ref = "coil" }
splashscreen                   = { group = "androidx.core",           name = "core-splashscreen",      version.ref = "splashscreen" }
material                        = { group = "com.google.android.material", name = "material",            version.ref = "material" }
sqlcipher-android               = { group = "net.zetetic",            name = "android-database-sqlcipher", version.ref = "sqlcipher" }
junit                           = { group = "junit",                  name = "junit",                  version.ref = "junit" }
coroutines-test                 = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk                           = { group = "io.mockk",                name = "mockk",                  version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
