name: Android CI

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

env:
  GRADLE_USER_HOME: ~/.gradle
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 27.2.12479018
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | "$SDKMANAGER" "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ hashFiles('main/android/**/*.gradle.kts', 'main/android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Cache NDK build (.cxx)
        uses: actions/cache@v4
        with:
          path: main/android/app/.cxx
          key: ndk-arm64-${{ hashFiles('main/android/app/CMakeLists.txt', 'main/android/app/src/main/cpp/**') }}
          restore-keys: ndk-arm64-

      - name: Cache third_party (llama.cpp + whisper.cpp)
        uses: actions/cache@v4
        with:
          path: main/android/app/src/main/cpp/third_party
          key: third-party-llama-b9530-whisper-v1.9.1

      - name: Fetch llama.cpp and whisper.cpp
        working-directory: main
        run: bash scripts/setup.sh

      - name: Make gradlew executable
        run: chmod +x main/android/gradlew

      - name: Run unit tests
        working-directory: main/android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: main/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: main/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── Release APK (main branch + tag pushes, requires signing secrets) ──
      - name: Build release APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: main/android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=${{ github.workspace }}/main/android/app/keystore.jks \
              -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --no-daemon --stacktrace
          else
            echo "Skipping signed release: KEYSTORE_BASE64 secret not set"
          fi

      - name: Upload release APK artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: main/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30

      # ── GitHub Release (tag pushes only) ──────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          DEBUG_APK="main/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="main/android/app/build/outputs/apk/release/app-release.apk"

          ASSETS="$DEBUG_APK"
          [ -f "$RELEASE_APK" ] && ASSETS="$ASSETS $RELEASE_APK"

          NOTES="## What's new in ${TAG}

          ### Bug fixes
          - Mic-stop button discarded the recording instead of transcribing it — voice input never reached the text field. Whisper transcription now runs off the main thread and fills the input box, same as typed text.

          ### Notes
          - One local model loads based on device RAM: ≥6 GB free → Llama 3.1 8B, else Qwen 2.5 1.5B
          - Configure a cloud provider in Settings for best tool reliability
          - Release APK requires signing secrets; debug APK attached for sideloading"

          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "CAAMAS ${TAG}" --notes "$NOTES"
            for asset in $ASSETS; do
              gh release upload "$TAG" "$asset" --repo "${{ github.repository }}" --clobber
            done
          else
            gh release create "$TAG" $ASSETS \
              --title "CAAMAS ${TAG}" --notes "$NOTES"
          fi
